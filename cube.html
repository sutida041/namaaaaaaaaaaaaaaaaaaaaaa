<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube - Volume Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Block 1: same header structure as the teacher's cylinder.html -->
<header>
    <h1>Cube</h1>
    <p>A cube has six equal square faces and twelve edges of equal length. A dice-shaped block is a common example.</p>
    <p>Every edge of a cube has the same length, side (a). Multiply side × side × side to calculate its volume.</p>
</header>

<main>
    <!-- Block 2: local image with relative path -->
    <div class="column">
        <img src="asset/example.svg" height="150" alt="Cube example">
        <p>Cube shape</p>
        <p>Source: <a href="asset/example.svg" target="_blank">Local SVG illustration</a></p>
    </div>

    <!-- Block 3: local diagram with relative path -->
    <div class="column">
        <h2>Cube Volume</h2>
        <img src="asset/geometry.svg" height="150" alt="Cube volume diagram">
    </div>

    <!-- Block 4: submit form + space for JavaScript output -->
    <div class="column">
        <h2>Volume Calculator</h2>
        <form id="volumeCalculator">
            <p><label for="inSide">Side:</label>
            <input type="number" id="inSide" step="any" min="0" value="5" required></p>
            <p><label for="inUnit">Unit:</label>
            <select id="inUnit">
                <option value="1">cm</option>
                <option value="1000">mm</option>
            </select></p>
            <p><button type="submit">Calculate</button></p>
        </form>
        <p id="result" aria-live="polite"></p>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
