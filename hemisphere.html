<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemisphere - Volume Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Block 1: same header structure as the teacher's cylinder.html -->
<header>
    <h1>Hemisphere</h1>
    <p>A hemisphere is one half of a sphere, cut through its center. A dome can have a hemispherical shape.</p>
    <p>Only the radius (r) is needed. Calculate half the volume of a full sphere: two-thirds of πr³.</p>
</header>

<main>
    <!-- Block 2: local image with relative path -->
    <div class="column">
        <img src="asset/example.svg" height="150" alt="Hemisphere example">
        <p>Hemisphere shape</p>
        <p>Source: <a href="asset/example.svg" target="_blank">Local SVG illustration</a></p>
    </div>

    <!-- Block 3: local diagram with relative path -->
    <div class="column">
        <h2>Hemisphere Volume</h2>
        <img src="asset/geometry.svg" height="150" alt="Hemisphere volume diagram">
    </div>

    <!-- Block 4: submit form + space for JavaScript output -->
    <div class="column">
        <h2>Volume Calculator</h2>
        <form id="volumeCalculator">
            <p><label for="inRadius">Radius:</label>
            <input type="number" id="inRadius" step="any" min="0" value="5" required></p>
            <p><label for="inUnit">Unit:</label>
            <select id="inUnit">
                <option value="1">cm</option>
                <option value="1000">mm</option>
            </select></p>
            <p><button type="submit">Calculate</button></p>
        </form>
        <p id="result" aria-live="polite"></p>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
